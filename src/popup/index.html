<!doctype html>
<html lang="ja" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScoreSaber Playlist Maker</title>
  </head>
  <body>
    <div class="app">
      <section class="panel filters" aria-label="フィルタ">
        <header class="filters-head">
          <h1>フィルタ</h1>
          <div class="filters-tools">
          <button id="openSettings" class="settings-button" type="button" aria-label="設定" title="設定">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path fill="currentColor" d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492M5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0" />
              <path fill="currentColor" d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.291c.415.764-.42 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 0 0-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.692-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.291A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.377l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115z" />
            </svg>
          </button>
          <button id="toggleFilters" class="filter-toggle" type="button" aria-expanded="true" aria-controls="filterBody" aria-label="フィルタを折りたたむ">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M10 3.5 5.5 8 10 12.5" />
            </svg>
          </button>
          </div>
        </header>

        <div id="filterBody" class="filter-body">
        <div class="filter-row" data-filter="star">
          <span class="filter-name">星</span>
          <input id="enableFilterByStar" class="form-check-input" type="checkbox" aria-label="星によるフィルタの有効化" />
          <input id="filterByStarLow" class="form-control form-control-sm" type="text" inputmode="decimal" placeholder="最小" aria-label="星の最小" autocomplete="off" disabled />
          <span class="range-sep" aria-hidden="true">〜</span>
          <input id="filterByStarMax" class="form-control form-control-sm" type="text" inputmode="decimal" placeholder="最大" aria-label="星の最大" autocomplete="off" disabled />
        </div>

        <div class="filter-row" data-filter="pp">
          <span class="filter-name">PP</span>
          <input id="enableFilterByPP" class="form-check-input" type="checkbox" aria-label="PPによるフィルタの有効化" />
          <input id="filterByPPLow" class="form-control form-control-sm" type="text" inputmode="decimal" placeholder="最小" aria-label="PPの最小" autocomplete="off" disabled />
          <span class="range-sep" aria-hidden="true">〜</span>
          <input id="filterByPPMax" class="form-control form-control-sm" type="text" inputmode="decimal" placeholder="最大" aria-label="PPの最大" autocomplete="off" disabled />
        </div>

        <div class="filter-row" data-filter="acc">
          <span class="filter-name">精度</span>
          <input id="enableFilterByACC" class="form-check-input" type="checkbox" aria-label="精度によるフィルタの有効化" />
          <input id="filterByACCLow" class="form-control form-control-sm" type="text" inputmode="decimal" placeholder="最小" aria-label="精度の最小" autocomplete="off" disabled />
          <span class="range-sep" aria-hidden="true">〜</span>
          <input id="filterByACCMax" class="form-control form-control-sm" type="text" inputmode="decimal" placeholder="最大" aria-label="精度の最大" autocomplete="off" disabled />
        </div>

        <div class="filter-row" data-filter="miss">
          <span class="filter-name">ミス数</span>
          <input id="enableFilterByMiss" class="form-check-input" type="checkbox" aria-label="ミス数によるフィルタの有効化" />
          <input id="filterByMissLow" class="form-control form-control-sm" type="text" inputmode="numeric" placeholder="最小" aria-label="ミス数の最小" autocomplete="off" disabled />
          <span class="range-sep" aria-hidden="true">〜</span>
          <input id="filterByMissMax" class="form-control form-control-sm" type="text" inputmode="numeric" placeholder="最大" aria-label="ミス数の最大" autocomplete="off" disabled />
        </div>

        <div class="filter-row">
          <span class="filter-name">個数</span>
          <input id="enableInfinity" class="form-check-input" type="checkbox" aria-label="個数の有効化" />
          <input id="filterByRange" class="form-control form-control-sm filter-span" type="text" inputmode="numeric" placeholder="件数" aria-label="個数" autocomplete="off" disabled />
        </div>

        <div class="compare-filter">
          <label class="form-label" for="selfCompare">自分との比較</label>
          <select id="selfCompare" class="form-select form-select-sm" disabled>
            <option value="">指定しない</option>
            <option value="unplayed">自分もプレイしていない</option>
            <option value="played">自分もプレイしている</option>
            <option value="win">自分が勝っている</option>
            <option value="lose">自分が負けている</option>
            <option value="tie">どちらでもない</option>
          </select>
        </div>

        <div class="options">
          <div class="form-check">
            <input id="enableUnranked" class="form-check-input" type="checkbox" />
            <label class="form-check-label" for="enableUnranked">アンランクで収集する</label>
          </div>
          <div class="form-check">
            <input id="onlyNF" class="form-check-input" type="checkbox" />
            <label class="form-check-label" for="onlyNF">NFのみで収集する</label>
          </div>
        </div>

        <div class="filter-footer">
          <label class="form-label" for="playlistName">プレイリスト名</label>
          <input id="playlistName" class="form-control form-control-sm" type="text" placeholder="プレイリスト名" autocomplete="off" />
          <div class="actions">
            <button id="aceptFilter" class="btn btn-primary btn-sm" type="button">適用</button>
            <button id="createPlaylist" class="btn btn-primary btn-sm" type="button">作成</button>
          </div>
        </div>
        </div>
      </section>

      <section class="panel results" aria-labelledby="mapHeading">
        <header class="results-head">
          <h2 id="mapHeading">譜面</h2>
          <div class="results-tools">
            <p id="progress">未検索</p>
          </div>
        </header>
        <div id="mapList" class="map-list" tabindex="0"></div>
      </section>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
